<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar pago · Cautiva Business</title><link rel="stylesheet" href="css/login.css"></head>
<body><main class="payment-page"><section class="payment-card"><div class="payment-brand"><span class="brand-mark">C</span><div><strong>CAUTIVA</strong><small>BUSINESS</small></div></div><span class="eyebrow">REGISTRO DE PAGO</span><h1>Envía tu comprobante</h1><p class="muted">Solo necesitamos el ID/OID del pago y la captura generada por tu banco.</p><div id="paymentInfo" class="payment-info"><p>Cargando información...</p></div><form id="paymentForm" class="payment-form hidden"><label>ID / OID del pago *<input id="oid" name="oid" required maxlength="80" placeholder="Número de referencia"></label><label>Captura del comprobante *<input id="capture" name="capture" type="file" accept="image/jpeg,image/png,image/webp" required><small>JPG, PNG o WEBP. La imagen será optimizada antes de enviarse.</small></label><div id="capturePreview" class="capture-preview"></div><button class="btn-primary" type="submit">Enviar comprobante</button></form><div id="paymentResult" class="payment-result hidden"></div></section></main><script type="module" src="js/pago.js"></script></body></html>
